[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "checksnap"
version = "0.1.1"
description = "Check datasets and code with SubQ Snap and local analysis"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
images = ["pillow>=10"]
dev = ["pytest>=8", "pillow>=10"]

[project.scripts]
checksnap = "checksnap.cli:main"

[tool.setuptools.packages.find]
include = ["checksnap*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
